name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create dummy google-services.json
      run: |
        echo '{
          "project_info": {
            "project_number": "1234567890",
            "project_id": "fb-lite-dummy",
            "storage_bucket": "fb-lite-dummy.appspot.com"
          },
          "client": [{
            "client_info": {
              "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
              "android_client_info": {
                "package_name": "com.aistudio.fblite.fastopen"
              }
            },
            "oauth_client": [],
            "api_key": [{
              "current_key": "AIzaSyDummyKeyForBuildProcessOnly123456"
            }],
            "services": {
              "analytics_service": {
                "status": 1
              },
              "app_measurement_service": {
                "status": 1
              }
            }
          }],
          "configuration_version": "1"
        }' > app/google-services.json

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
